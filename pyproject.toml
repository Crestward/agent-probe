[project]
name = "agent-probe"
version = "0.1.0"
description = "MCP/agent red-teaming & guardrail benchmark — attacks LLM agents and measures the defence (ASR / Refusal Rate / tool-hijack rate), mapped to OWASP LLM Top 10 (2026) and MITRE ATLAS."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Oladimeji Adeyemi" }]
keywords = ["llm-security", "red-teaming", "mcp", "owasp-llm", "mitre-atlas", "ai-security", "evals"]

dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",          # also drives DeepSeek via base_url override
    "fastmcp>=2.0",
    "mcp>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
agent-probe = "agent_probe.cli:app"

[project.urls]
Homepage = "https://github.com/oladimeji/agent-probe"
Repository = "https://github.com/oladimeji/agent-probe"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_probe"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
