name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest

  # Phase 4 adds a `security-gate` job here:
  #   uv run agent-probe gate evals/results/guarded.jsonl --max-asr <threshold>
  # It runs the fast gold suite on recorded fixtures and fails the build if the
  # GUARDED-config ASR regresses past the threshold (see SPEC.md §9).
